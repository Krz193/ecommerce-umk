name: Flutter CI

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
  
on:
  push:
    branches:
      - dev
      - feature/**

  pull_request:
    branches:
      - dev
      - main

jobs:

  # =========================================================
  # Analyze
  # Check code quality using flutter analyze
  # =========================================================
  analyze:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      # Clone repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Install Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      # Cache pub dependencies
      # Makes CI faster on next runs
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      # Create .env file from GitHub Secrets
      - name: Create .env
        run: |
          printf "SUPABASE_URL=${{ secrets.SUPABASE_URL }}\n" > .env
          printf "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}\n" >> .env

      # Install project dependencies
      - name: Install dependencies
        run: flutter pub get

      # Run static analysis
      - name: Analyze code
        run: flutter analyze

  # =========================================================
  # Build Debug APK
  # Build APK only after analyze & test pass
  # =========================================================
  build-debug:
    runs-on: ubuntu-latest

    needs:
      - analyze
      - test

    # Only run on:
    # - dev branch push
    # - PR to main
    if: github.ref == 'refs/heads/dev' || github.base_ref == 'main'

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Create .env
        run: |
          printf "SUPABASE_URL=${{ secrets.SUPABASE_URL }}\n" > .env
          printf "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}\n" >> .env

      - name: Install dependencies
        run: flutter pub get

      # Build debug APK
      # github.run_number = automatic build number
      - name: Build debug APK
        run: |
          flutter build apk \
          --debug \
          --build-number=${{ github.run_number }}

      # Upload APK to GitHub Actions artifact
      # Can be downloaded from workflow result
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
